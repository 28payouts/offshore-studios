<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OFFSHORE OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="core.css?v=3">
</head>
<body>

<!-- ═══════════ THE AIRLOCK ═══════════ -->
<div id="gate">
  <canvas id="gatebg"></canvas>
  <div class="gcard">
    <div class="orb"><span class="vx v1"></span><span class="vx v2"></span><span class="vx v3"></span><span class="vcore"></span></div>
    <h1>OFFSHORE <span class="grad">OS</span></h1>
    <div class="gsub">A LIVING WORLD · EVERY OFFSHORE SYSTEM</div>
    <div class="gfields">
      <input id="inEmail" type="email" placeholder="email" autocomplete="username">
      <input id="inPass" type="password" placeholder="access code" autocomplete="current-password">
      <button id="btnIn">DIVE IN</button>
    </div>
    <div class="gmsg" id="gateMsg"></div>
    <div class="gmode mono" id="gateMode"></div>
  </div>
</div>

<!-- ═══════════ THE WORLD ═══════════ -->
<div id="app" hidden>
  <canvas id="bgfx"></canvas>
  <div id="statusbar" class="mono"></div>
  <div class="frame">
    <nav id="rail"></nav>
    <main id="stage"></main>
  </div>
</div>

<!-- bump ?v= on any file you change — one number busts every visitor's cache -->
<script src="config.js?v=3"></script>
<script src="bus.js?v=3"></script>
<script src="mod-home.js?v=3"></script>
<script src="mod-claude.js?v=3"></script>
<script src="mod-livemind.js?v=3"></script>
<script src="mod-clients.js?v=3"></script>
<script src="mod-agency.js?v=3"></script>
<script src="mod-agents.js?v=3"></script>
<script src="boot.js?v=3"></script>
</body>
</html>
