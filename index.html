<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OFFSHORE STUDIOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="core.css?v=4">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#01070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Offshore">
</head>
<body>

<!-- ═══════════ THE AIRLOCK ═══════════ -->
<div id="gate">
  <canvas id="gatebg"></canvas>
  <div class="gcard">
    <h1>OFFSHORE <span class="grad">STUDIOS</span></h1>
    <div class="gsub">TWO UNIVERSES · ONE COMMAND DECK</div>
    <div class="gfields">
      <input id="inEmail" type="email" placeholder="email" autocomplete="username">
      <input id="inPass" type="password" placeholder="access code" autocomplete="current-password">
      <button id="btnIn">DIVE IN</button>
    </div>
    <div class="gmsg" id="gateMsg"></div>
    <div class="gmode mono" id="gateMode"></div>
  </div>
</div>

<!-- ═══════════ THE WORLD ═══════════ -->
<div id="app" hidden>
  <canvas id="bgfx"></canvas>
  <div id="statusbar" class="mono"></div>
  <div class="frame">
    <nav id="rail"></nav>
    <main id="stage"></main>
  </div>
</div>

<!-- bump ?v= on any file you change — one number busts every visitor's cache -->
<script src="config.js?v=5"></script>
<script src="bus.js?v=3"></script>
<script src="mod-home.js?v=6"></script>
<script src="mod-roundtable.js?v=4"></script>
<script src="mod-claude.js?v=3"></script>
<script src="mod-livemind.js?v=5"></script>
<script src="mod-academy.js?v=1"></script>
<script src="mod-clients.js?v=3"></script>
<script src="mod-agency.js?v=4"></script>
<script src="mod-agents.js?v=3"></script>
<script src="boot.js?v=6"></script>
<script src="fx.js?v=2"></script>
<script>
/* real software: register the service worker + surface the install prompt */
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); window.__installEvt = e;
  const b = document.createElement("button");
  b.id = "installBtn"; b.textContent = "⬇ INSTALL OFFSHORE OS";
  b.style.cssText = "position:fixed;bottom:18px;right:18px;z-index:80;padding:13px 20px;border:0;border-radius:99px;font:700 10.5px 'Unbounded',sans-serif;letter-spacing:.2em;color:#012;cursor:pointer;background:linear-gradient(100deg,#00e8d0,#4cdcff);box-shadow:0 14px 40px -8px rgba(0,232,208,.6)";
  b.onclick = async () => { b.remove(); window.__installEvt.prompt(); };
  document.body.appendChild(b);
});
</script>
</body>
</html>
